name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Create project
        run: |
          mkdir -p PayVoice/app/src/main/java/com/payvoice
          cd PayVoice
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "PayVoice"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.payvoice'
              compileSdk 34
              defaultConfig {
                  applicationId "com.payvoice"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="PayVoice" android:icon="@drawable/ic_logo">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".PaymentListener" android:exported="true"
                      android:label="PayVoice"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService"/>
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/payvoice/PaymentListener.java <<'EOF'
          package com.payvoice;
          import android.app.Notification;
          import android.os.Bundle;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;
          import android.speech.tts.TextToSpeech;
          import java.util.HashMap;
          import java.util.Locale;
          import java.util.Map;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          public class PaymentListener extends NotificationListenerService implements TextToSpeech.OnInitListener {
              private static final Map<String, String> APPS = new HashMap<>();
              static {
                  APPS.put("net.one97.paytm", "पेटीएम");
                  APPS.put("com.phonepe.app", "फोनपे");
                  APPS.put("com.google.android.apps.nbu.paisa.user", "गूगल पे");
                  APPS.put("in.org.npci.upiapp", "भीम");
                  APPS.put("in.amazon.mShop.android.shopping", "अमेज़न पे");
              }
              private static final Pattern AMOUNT = Pattern.compile("(?:₹|Rs\\.?|INR)\\s?([0-9][0-9,]*(?:\\.[0-9]{1,2})?)", Pattern.CASE_INSENSITIVE);
              private TextToSpeech tts;
              private boolean ready = false;
              private String lastKey = "";
              private long lastTime = 0;
              @Override public void onCreate() {
                  super.onCreate();
                  tts = new TextToSpeech(this, this);
              }
              @Override public void onInit(int status) {
                  if (status == TextToSpeech.SUCCESS) {
                      int r = tts.setLanguage(new Locale("hi", "IN"));
                      ready = r != TextToSpeech.LANG_MISSING_DATA && r != TextToSpeech.LANG_NOT_SUPPORTED;
                      if (!ready) { tts.setLanguage(Locale.ENGLISH); ready = true; }
                  }
              }
              @Override public void onNotificationPosted(StatusBarNotification sbn) {
                  String appName = APPS.get(sbn.getPackageName());
                  if (appName == null) return;
                  Bundle e = sbn.getNotification().extras;
                  String title = String.valueOf(e.getCharSequence(Notification.EXTRA_TITLE, ""));
                  CharSequence big = e.getCharSequence(Notification.EXTRA_BIG_TEXT);
                  String text = big != null ? big.toString() : String.valueOf(e.getCharSequence(Notification.EXTRA_TEXT, ""));
                  String all = (title + " " + text).toLowerCase(Locale.ROOT);
                  boolean received = all.contains("received") || all.contains("paid you") || all.contains("sent you")
                          || all.contains("credited") || all.contains("प्राप्त") || all.contains("आपको");
                  boolean sent = all.contains("paid to") || all.contains("sent to") || all.contains("debited")
                          || all.contains("you paid") || all.contains("you sent");
                  if (!received || sent) return;
                  Matcher m = AMOUNT.matcher(title + " " + text);
                  if (!m.find()) return;
                  String amt = m.group(1).replace(",", "");
                  if (amt.endsWith(".00")) amt = amt.substring(0, amt.length() - 3);
                  String key = appName + amt;
                  long now = System.currentTimeMillis();
                  if (key.equals(lastKey) && now - lastTime < 5000) return;
                  lastKey = key; lastTime = now;
                  speak(appName + " पर " + amt + " रुपये प्राप्त हुए, धन्यवाद।");
              }
              private void speak(String s) {
                  if (ready) tts.speak(s, TextToSpeech.QUEUE_ADD, null, "pay");
              }
              @Override public void onDestroy() {
                  if (tts != null) { tts.stop(); tts.shutdown(); }
                  super.onDestroy();
              }
          }
          EOF
          cat > app/src/main/java/com/payvoice/MainActivity.java <<'EOF'
          package com.payvoice;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.speech.tts.TextToSpeech;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import java.util.Locale;
          public class MainActivity extends Activity {
              private TextToSpeech tts;
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  l.setGravity(Gravity.CENTER);
                  l.setPadding(48, 48, 48, 48);
                  TextView t = new TextView(this);
                  t.setText("PayVoice\n\n1) Notification access ON karein\n2) Battery restriction hataayein\n3) Test karke awaaz check karein");
                  t.setTextSize(18);
                  l.addView(t);
                  Button a = new Button(this); a.setText("Notification Access Kholein");
                  a.setOnClickListener(v -> startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS")));
                  l.addView(a);
                  Button c = new Button(this); c.setText("Battery Optimization Hataayein");
                  c.setOnClickListener(v -> {
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      if (!pm.isIgnoringBatteryOptimizations(getPackageName())) {
                          Intent i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                          i.setData(Uri.parse("package:" + getPackageName()));
                          startActivity(i);
                      }
                  });
                  l.addView(c);
                  Button d = new Button(this); d.setText("Test Awaaz");
                  d.setOnClickListener(v -> tts.speak("पेटीएम पर 20 रुपये प्राप्त हुए, धन्यवाद।", TextToSpeech.QUEUE_FLUSH, null, "t"));
                  l.addView(d);
                  setContentView(l);
                  tts = new TextToSpeech(this, s -> { if (s == TextToSpeech.SUCCESS) tts.setLanguage(new Locale("hi", "IN")); });
              }
              @Override protected void onDestroy() { if (tts != null) tts.shutdown(); super.onDestroy(); }
          }
          EOF
      - name: Add logo
        run: |
          mkdir -p PayVoice/app/src/main/res/drawable
          cp logo.png PayVoice/app/src/main/res/drawable/ic_logo.png
      - name: Build
        working-directory: PayVoice
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PayVoice-apk
          path: PayVoice/app/build/outputs/apk/debug/app-debug.apk
