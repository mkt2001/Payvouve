          package com.mahesh.applock

          import android.content.Intent
          import android.os.Bundle
          import android.view.WindowManager
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.fragment.app.FragmentActivity

          /** Base screen: blocks screenshots and offers gate() = ask PIN / fingerprint before a sensitive action. */
          open class SecureActivity : FragmentActivity() {
              private var pend: (() -> Unit)? = null

              private val authLauncher = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { r ->
                  val a = pend
                  pend = null
                  if (r.resultCode == RESULT_OK) a?.invoke() else onAuthCancelled()
              }

              protected open fun onAuthCancelled() {}

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE)
              }

              /** Runs action only after a fresh PIN/fingerprint check (valid for maxAgeMs). */
              protected fun gate(maxAgeMs: Long = 20_000L, setup: Boolean = false, action: () -> Unit) {
                  if (pend != null) return
                  if (!setup && Session.age() < maxAgeMs) {
                      action()
                      return
                  }
                  pend = action
                  val i = Intent(this, ConfirmActivity::class.java)
                  if (setup) i.putExtra(LockActivity.EXTRA_MODE, LockActivity.MODE_SETUP)
                  authLauncher.launch(i)
              }
          }
