          mkdir -p "$(dirname 'app/src/main/java/com/mahesh/applock/VaultActivity.kt')"
          cat > 'app/src/main/java/com/mahesh/applock/VaultActivity.kt' <<'APPLOCK_EOF'
          package com.mahesh.applock

          import android.app.AlertDialog
          import android.app.Dialog
          import android.content.ContentValues
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Bundle
          import android.provider.DocumentsContract
          import android.provider.MediaStore
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.webkit.MimeTypeMap
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.MediaController
          import android.widget.TextView
          import android.widget.Toast
          import android.widget.VideoView
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.security.crypto.EncryptedFile
          import java.io.File
          import java.util.UUID

          class VaultActivity : SecureActivity() {
              private val dir by lazy { File(filesDir, "vault").apply { mkdirs() } }
              private val files = mutableListOf<File>()
              private var list: ListView? = null
              private var emptyTv: TextView? = null
              private val labels = mutableListOf<String>()
              private var ad: ArrayAdapter<String>? = null

              private val picker = registerForActivityResult(ActivityResultContracts.OpenMultipleDocuments()) { uris ->
                  if (uris.isNotEmpty()) gate { importAll(uris) }
              }

              private fun enc(f: File) = EncryptedFile.Builder(
                  this, f, SecureStore.masterKey(this), EncryptedFile.FileEncryptionScheme.AES256_GCM_HKDF_4KB
              ).build()

              private fun mimeOf(f: File) = f.name.substringAfter("__").replaceFirst("-", "/")

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  cacheDir.listFiles()?.filter { it.name.startsWith("play_") }?.forEach { it.delete() }
              }

              override fun onResume() {
                  super.onResume()
                  gate { ensureUi(); reload() }
              }

              override fun onAuthCancelled() {
                  finish()
              }

              private fun ensureUi() {
                  if (list != null) return
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(30), dp(16), dp(12))
                      background = grad(0xFF00897B.toInt(), 0xFF1A237E.toInt())
                  }
                  val top = LinearLayout(this).apply { gravity = Gravity.CENTER_VERTICAL }
                  top.addView(TextView(this).apply {
                      text = "←"; textSize = 28f; setTextColor(Color.WHITE); setPadding(0, 0, dp(14), 0)
                      setOnClickListener { finish() }
                  })
                  top.addView(TextView(this).apply {
                      text = "🗂️ Private Vault"; textSize = 24f; setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD
                  })
                  root.addView(top)
                  root.addView(Button(this).apply {
                      text = "➕  Add photos & videos"
                      textSize = 18f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.DEFAULT_BOLD
                      background = grad(0xFFFF9800.toInt(), 0xFFE65100.toInt(), 18, true)
                      setOnClickListener { gate { picker.launch(arrayOf("image/*", "video/*")) } }
                  }, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(58)).apply {
                      topMargin = dp(18); bottomMargin = dp(12)
                  })
                  val tv = TextView(this).apply {
                      text = "Vault is empty\nTap Add to hide photos & videos"
                      textSize = 15f
                      setTextColor(0xCCFFFFFF.toInt())
                      gravity = Gravity.CENTER
                      setPadding(0, dp(40), 0, 0)
                  }
                  root.addView(tv)
                  val a = object : ArrayAdapter<String>(this, 0, labels) {
                      override fun getView(pos: Int, v: View?, p: ViewGroup): View {
                          val t = TextView(context)
                          t.text = getItem(pos)
                          t.textSize = 17f
                          t.setTextColor(Color.WHITE)
                          t.setPadding(dp(16), dp(16), dp(16), dp(16))
                          t.background = grad(0x33FFFFFF, 0x33FFFFFF, 16)
                          return t
                      }
                  }
                  val lv = ListView(this)
                  lv.adapter = a
                  lv.divider = null
                  lv.dividerHeight = dp(8)
                  lv.setOnItemClickListener { _, _, i, _ -> gate { open(files[i]) } }
                  lv.setOnItemLongClickListener { _, _, i, _ -> options(files[i]); true }
                  root.addView(lv, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))
                  root.addView(TextView(this).apply {
                      text = "Tap to view • Hold for options"
                      textSize = 12f
                      setTextColor(0x99FFFFFF.toInt())
                      gravity = Gravity.CENTER
                      setPadding(0, dp(6), 0, 0)
                  })
                  setContentView(root)
                  list = lv
                  emptyTv = tv
                  ad = a
              }

              private fun reload() {
                  files.clear()
                  files.addAll(dir.listFiles()?.sortedByDescending { it.lastModified() } ?: emptyList())
                  var p = 0
                  var v = 0
                  labels.clear()
                  files.forEach {
                      val kb = it.length() / 1024
                      labels.add(if (mimeOf(it).startsWith("video/")) "🎬  Video ${++v}   ($kb KB)" else "🖼️  Photo ${++p}   ($kb KB)")
                  }
                  ad?.notifyDataSetChanged()
                  emptyTv?.visibility = if (files.isEmpty()) View.VISIBLE else View.GONE
              }

              private fun importAll(uris: List<Uri>) {
                  ensureUi()
                  Thread {
                      var ok = 0
                      var deleted = 0
                      for (u in uris) {
                          try {
                              val mime = contentResolver.getType(u) ?: "image/jpeg"
                              val f = File(dir, "${UUID.randomUUID()}__${mime.replaceFirst("/", "-")}")
                              contentResolver.openInputStream(u)!!.use { input ->
                                  enc(f).openFileOutput().use { out -> input.copyTo(out) }
                              }
                              ok++
                              try {
                                  if (DocumentsContract.deleteDocument(contentResolver, u)) deleted++
                              } catch (_: Exception) {
                              }
                          } catch (e: Exception) {
                              // skip file
                          }
                      }
                      runOnUiThread {
                          val note = if (deleted < ok) "\nDelete the originals from Gallery yourself (${ok - deleted} left)." else ""
                          Toast.makeText(this, "$ok file(s) hidden.$note", Toast.LENGTH_LONG).show()
                          reload()
                      }
                  }.start()
              }

              private fun fullScreen(): Dialog = Dialog(this, android.R.style.Theme_Black_NoTitleBar_Fullscreen).also {
                  it.window?.setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE)
              }

              private fun open(f: File) {
                  Thread {
                      try {
                          if (mimeOf(f).startsWith("video/")) {
                              val tmp = File(cacheDir, "play_${f.name}.mp4")
                              enc(f).openFileInput().use { i -> tmp.outputStream().use { o -> i.copyTo(o) } }
                              runOnUiThread {
                                  val d = fullScreen()
                                  val vv = VideoView(this)
                                  val mc = MediaController(this)
                                  mc.setAnchorView(vv)
                                  vv.setMediaController(mc)
                                  vv.setVideoPath(tmp.absolutePath)
                                  d.setContentView(vv)
                                  d.setOnDismissListener { vv.stopPlayback(); tmp.delete() }
                                  d.show()
                                  vv.start()
                              }
                          } else {
                              val bytes = enc(f).openFileInput().use { it.readBytes() }
                              val o = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                              BitmapFactory.decodeByteArray(bytes, 0, bytes.size, o)
                              var s = 1
                              while (o.outWidth / s > 2048 || o.outHeight / s > 2048) s *= 2
                              val opt = BitmapFactory.Options().apply { inSampleSize = s }
                              val bmp = BitmapFactory.decodeByteArray(bytes, 0, bytes.size, opt)
                              runOnUiThread {
                                  val d = fullScreen()
                                  val iv = ImageView(this)
                                  iv.setImageBitmap(bmp)
                                  iv.scaleType = ImageView.ScaleType.FIT_CENTER
                                  d.setContentView(iv)
                                  d.show()
                              }
                          }
                      } catch (e: Exception) {
                          runOnUiThread { Toast.makeText(this, "Could not open file", Toast.LENGTH_SHORT).show() }
                      }
                  }.start()
              }

              private fun options(f: File) {
                  AlertDialog.Builder(this)
                      .setItems(arrayOf("Send back to Gallery", "Delete forever")) { _, w ->
                          if (w == 0) {
                              gate { restore(f) }
                          } else {
                              AlertDialog.Builder(this).setMessage("Delete this file forever?")
                                  .setPositiveButton("Delete") { _, _ -> gate { f.delete(); reload() } }
                                  .setNegativeButton("Cancel", null).show()
                          }
                      }.show()
              }

              private fun restore(f: File) {
                  Thread {
                      try {
                          val mime = mimeOf(f)
                          val vid = mime.startsWith("video/")
                          val ext = MimeTypeMap.getSingleton().getExtensionFromMimeType(mime) ?: if (vid) "mp4" else "jpg"
                          val cv = ContentValues().apply {
                              put(MediaStore.MediaColumns.DISPLAY_NAME, "restored_${System.currentTimeMillis()}.$ext")
                              put(MediaStore.MediaColumns.MIME_TYPE, mime)
                              put(MediaStore.MediaColumns.RELATIVE_PATH, if (vid) "Movies/Restored" else "Pictures/Restored")
                          }
                          val coll = if (vid) MediaStore.Video.Media.EXTERNAL_CONTENT_URI else MediaStore.Images.Media.EXTERNAL_CONTENT_URI
                          val u = contentResolver.insert(coll, cv)!!
                          contentResolver.openOutputStream(u)!!.use { out -> enc(f).openFileInput().use { it.copyTo(out) } }
                          f.delete()
                          runOnUiThread { Toast.makeText(this, "Sent back to Gallery", Toast.LENGTH_SHORT).show(); reload() }
                      } catch (e: Exception) {
                          runOnUiThread { Toast.makeText(this, "Restore failed", Toast.LENGTH_SHORT).show() }
                      }
                  }.start()
              }
          }
