          fun Context.dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

          fun Context.grad(c1: Int, c2: Int, rDp: Int = 0, horizontal: Boolean = false): GradientDrawable =
              GradientDrawable(
                  if (horizontal) GradientDrawable.Orientation.LEFT_RIGHT else GradientDrawable.Orientation.TOP_BOTTOM,
                  intArrayOf(c1, c2)
              ).apply { cornerRadius = dp(rDp).toFloat() }
