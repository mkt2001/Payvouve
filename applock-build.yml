name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create project files
        run: |
          set -e
          mkdir -p proj
          cd proj
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'APPLOCK_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.mahesh.applock"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.mahesh.applock"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-ktx:1.9.1")
              implementation("androidx.fragment:fragment-ktx:1.8.2")
              implementation("androidx.biometric:biometric:1.1.0")
              implementation("androidx.security:security-crypto:1.1.0-alpha06")
              implementation("androidx.lifecycle:lifecycle-process:2.8.4")
          }
          APPLOCK_EOF
          mkdir -p "$(dirname 'app/proguard-rules.pro')"
          cat > 'app/proguard-rules.pro' <<'APPLOCK_EOF'
          -dontwarn com.google.errorprone.annotations.**
          -dontwarn javax.annotation.**
          -keep class com.google.crypto.tink.** { *; }
          APPLOCK_EOF
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'APPLOCK_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              <application
                  android:name=".App"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:allowBackup="false"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">

                  <activity android:name=".MainActivity" android:exported="true"
                      android:screenOrientation="portrait" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity android:name=".AppsActivity" android:exported="false" android:windowSoftInputMode="adjustResize"
                      android:screenOrientation="portrait" android:configChanges="orientation|screenSize|keyboardHidden" />

                  <activity android:name=".VaultActivity" android:exported="false"
                      android:screenOrientation="portrait" android:configChanges="orientation|screenSize|keyboardHidden" />

                  <activity android:name=".ConfirmActivity" android:exported="false"
                      android:screenOrientation="portrait" android:configChanges="orientation|screenSize|keyboardHidden" />

                  <activity android:name=".LockActivity" android:exported="false"
                      android:launchMode="singleTask" android:taskAffinity=""
                      android:screenOrientation="portrait" android:excludeFromRecents="true" />

                  <service android:name=".AppLockService" android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>

                  <receiver android:name=".AdminReceiver" android:exported="true"
                      android:permission="android.permission.BIND_DEVICE_ADMIN">
                      <meta-data android:name="android.app.device_admin" android:resource="@xml/device_admin" />
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          APPLOCK_EOF
          mkdir -p "$(dirname 'app/src/main/java/com/mahesh/applock/AdminReceiver.kt')"
          cat > 'app/src/main/java/com/mahesh/applock/AdminReceiver.kt' <<'APPLOCK_EOF'
          package com.mahesh.applock

          import android.app.admin.DeviceAdminReceiver

          class AdminReceiver : DeviceAdminReceiver()
          APPLOCK_EOF
          mkdir -p "$(dirname 'app/src/main/java/com/mahesh/applock/App.kt')"
          cat > 'app/src/main/java/com/mahesh/applock/App.kt' <<'APPLOCK_EOF'
          package com.mahesh.applock

          import android.app.Application

          object Session {
              @Volatile var authAt = 0L
              fun age(): Long = System.currentTimeMillis() - authAt
              fun mark() { authAt = System.currentTimeMillis() }
          }

          class App : Application()
          APPLOCK_EOF
          mkdir -p "$(dirname 'app/src/main/java/com/mahesh/applock/AppLockService.kt')"
          cat > 'app/src/main/java/com/mahesh/applock/AppLockService.kt' <<'APPLOCK_EOF'
          package com.mahesh.applock

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.provider.Settings
          import android.view.accessibility.AccessibilityEvent

          class AppLockService : AccessibilityService() {
              companion object {
                  @Volatile var unlockedPkg: String? = null
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent) {
                  if (e.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  val pkg = e.packageName?.toString() ?: return
                  if (pkg == packageName || pkg == "com.android.systemui" || isKeyboard(pkg)) return

                  if (pkg != unlockedPkg) unlockedPkg = null // user app se bahar nikla -> agli baar phir lock
                  if (pkg in SecureStore.lockedApps(this) && unlockedPkg != pkg) {
                      startActivity(
                          Intent(this, LockActivity::class.java)
                              .putExtra(LockActivity.EXTRA_PKG, pkg)
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_NO_ANIMATION)
                      )
                  }
              }

              private fun isKeyboard(pkg: String): Boolean =
                  Settings.Secure.getString(contentResolver, Settings.Secure.DEFAULT_INPUT_METHOD)
                      ?.startsWith("$pkg/") == true

              override fun onInterrupt() {}
          }
          APPLOCK_EOF
          mkdir -p "$(dirname 'app/src/main/java/com/mahesh/applock/AppsActivity.kt')"
          cat > 'app/src/main/java/com/mahesh/applock/AppsActivity.kt' <<'APPLOCK_EOF'
          package com.mahesh.applock

          import android.content.Intent
          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Switch
          import android.widget.TextView

          class AppsActivity : SecureActivity() {
              private val bgColor = 0xFF0A1018.toInt()
              private val cardColor = 0xFF1C212B.toInt()
              private val accent = 0xFFA8C7FA.toInt()
              private val muted = 0xFF8E9AAF.toInt()
              private val pastel = intArrayOf(0xFFA8C7FA.toInt(), 0xFFF9B4B4.toInt(), 0xFFFFC38A.toInt(), 0xFFB7E4C7.toInt())

              private var all: List<Pair<String, String>> = emptyList()
              private var listBox: LinearLayout? = null
              private var built = false

              override fun onResume() {
                  super.onResume()
                  gate(60_000L) { if (!built) render() }
              }

              override fun onAuthCancelled() {
                  finish()
              }

              private fun render() {
                  built = true
                  window.statusBarColor = bgColor
                  window.navigationBarColor = bgColor

                  val pm = packageManager
                  all = pm.queryIntentActivities(
                      Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0
                  ).map { it.activityInfo.packageName to it.loadLabel(pm).toString() }
                      .filter { it.first != packageName }
                      .distinctBy { it.first }
                      .sortedWith(compareBy({ it.first != SecureStore.PHOTOS }, { it.second.lowercase() }))

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(bgColor)
                      setPadding(dp(16), dp(14), dp(16), 0)
                  }

                  val top = LinearLayout(this).apply { gravity = Gravity.CENTER_VERTICAL }
                  top.addView(TextView(this).apply {
                      text = "←"; textSize = 28f; setTextColor(Color.WHITE); setPadding(0, 0, dp(16), 0)
                      setOnClickListener { finish() }
                  })
                  top.addView(TextView(this).apply {
                      text = "Lock Apps"; textSize = 26f; setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD
                  })
                  root.addView(top)

                  val pillBg = GradientDrawable().apply {
                      setColor(0xFF0F1520.toInt())
                      setStroke(dp(2), 0xFF3A4252.toInt())
                      cornerRadius = dp(30).toFloat()
                  }
                  val pill = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(18), dp(4), dp(18), dp(4))
                      background = pillBg
                  }
                  pill.addView(TextView(this).apply { text = "🔍"; textSize = 20f })
                  val search = EditText(this).apply {
                      hint = "Search apps"
                      setHintTextColor(muted)
                      setTextColor(Color.WHITE)
                      textSize = 17f
                      background = null
                      maxLines = 1
                      isSingleLine = true
                      setPadding(dp(14), dp(12), 0, dp(12))
                  }
                  pill.addView(search, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  root.addView(pill, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                      topMargin = dp(16)
                  })

                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, 0, 0, dp(24))
                  }
                  listBox = box
                  val sv = ScrollView(this)
                  sv.isVerticalScrollBarEnabled = false
                  sv.addView(box)
                  root.addView(sv, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))

                  search.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, st: Int, c: Int, a: Int) {}
                      override fun onTextChanged(s: CharSequence?, st: Int, b: Int, c: Int) {}
                      override fun afterTextChanged(s: Editable?) {
                          fill(s?.toString() ?: "")
                      }
                  })
                  fill("")
                  setContentView(root)
              }

              private fun fill(q: String) {
                  val box = listBox ?: return
                  box.removeAllViews()
                  val locked = SecureStore.lockedApps(this)
                  val m = all.filter { it.second.contains(q, ignoreCase = true) }
                  val a = m.filter { it.first in locked }
                  val b = m.filter { it.first !in locked }
                  addGroup(box, "Locked apps (${a.size})", a)
                  addGroup(box, "All apps", b)
                  if (m.isEmpty()) {
                      box.addView(TextView(this).apply {
                          text = "No apps found"; textSize = 15f; setTextColor(muted); gravity = Gravity.CENTER
                          setPadding(0, dp(40), 0, 0)
                      })
                  }
              }

              private fun addGroup(box: LinearLayout, title: String, items: List<Pair<String, String>>) {
                  if (items.isEmpty()) return
                  box.addView(TextView(this).apply {
                      text = title; textSize = 13f; setTextColor(accent); typeface = Typeface.DEFAULT_BOLD
                      setPadding(dp(8), dp(18), 0, dp(8))
                  })
                  items.forEachIndexed { i, item -> box.addView(row(item, i == 0, i == items.size - 1)) }
              }

              private fun row(item: Pair<String, String>, first: Boolean, last: Boolean): LinearLayout {
                  val pkg = item.first
                  val big = dp(26).toFloat()
                  val small = dp(6).toFloat()
                  val tl = if (first) big else small
                  val bl = if (last) big else small
                  val cardBg = GradientDrawable().apply {
                      setColor(cardColor)
                      cornerRadii = floatArrayOf(tl, tl, tl, tl, bl, bl, bl, bl)
                  }
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(16), dp(14), dp(16), dp(14))
                      background = cardBg
                  }

                  val circleBg = GradientDrawable().apply {
                      shape = GradientDrawable.OVAL
                      setColor(pastel[Math.abs(pkg.hashCode()) % pastel.size])
                  }
                  val circle = FrameLayout(this)
                  circle.background = circleBg
                  val iv = ImageView(this)
                  try {
                      iv.setImageDrawable(packageManager.getApplicationIcon(pkg))
                  } catch (e: Exception) {
                      // no icon
                  }
                  circle.addView(iv, FrameLayout.LayoutParams(dp(30), dp(30), Gravity.CENTER))
                  row.addView(circle, LinearLayout.LayoutParams(dp(48), dp(48)))

                  val label = TextView(this)
                  label.text = item.second
                  label.textSize = 18f
                  label.setTextColor(Color.WHITE)
                  label.setPadding(dp(16), 0, dp(8), 0)
                  row.addView(label, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))

                  val sw = Switch(this)
                  sw.isChecked = pkg in SecureStore.lockedApps(this)
                  sw.isClickable = false
                  sw.thumbTintList = ColorStateList(
                      arrayOf(intArrayOf(android.R.attr.state_checked), intArrayOf()),
                      intArrayOf(0xFF0A1018.toInt(), muted)
                  )
                  sw.trackTintList = ColorStateList(
                      arrayOf(intArrayOf(android.R.attr.state_checked), intArrayOf()),
                      intArrayOf(accent, 0xFF3A4252.toInt())
                  )
                  row.addView(sw)

                  row.setOnClickListener {
                      gate {
                          val nowOn = pkg !in SecureStore.lockedApps(this)
                          SecureStore.setLocked(this, pkg, nowOn)
                          sw.isChecked = nowOn
                      }
                  }
                  row.layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                      topMargin = dp(3)
                  }
                  return row
              }
          }
          APPLOCK_EOF
          mkdir -p "$(dirname 'app/src/main/java/com/mahesh/applock/ConfirmActivity.kt')"
          cat > 'app/src/main/java/com/mahesh/applock/ConfirmActivity.kt' <<'APPLOCK_EOF'
          package com.mahesh.applock

          /** PIN / fingerprint screen used inside this app; returns OK only when the user is verified. */
          class ConfirmActivity : LockActivity() {
              override fun onSuccess() {
                  Session.mark()
                  setResult(RESULT_OK)
                  finish()
              }

              override fun onCancel() {
                  setResult(RESULT_CANCELED)
                  finish()
              }
          }
          APPLOCK_EOF
          mkdir -p "$(dirname 'app/src/main/java/com/mahesh/applock/LockActivity.kt')"
          cat > 'app/src/main/java/com/mahesh/applock/LockActivity.kt' <<'APPLOCK_EOF'
          package com.mahesh.applock

          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.GridLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.OnBackPressedCallback
          import androidx.biometric.BiometricManager
          import androidx.biometric.BiometricManager.Authenticators.BIOMETRIC_STRONG
          import androidx.biometric.BiometricPrompt
          import androidx.core.content.ContextCompat
          import androidx.fragment.app.FragmentActivity

          open class LockActivity : FragmentActivity() {
              companion object {
                  const val EXTRA_MODE = "mode"
                  const val MODE_SETUP = "setup"
                  const val EXTRA_PKG = "pkg"
              }

              private var mode = ""
              protected var target: String? = null
              private var first: String? = null
              private var bioTried = false
              private val pin = StringBuilder()
              private lateinit var titleTv: TextView
              private lateinit var dotsTv: TextView
              private lateinit var msgTv: TextView
              private val keys = mutableListOf<Button>()
              private val handler = Handler(Looper.getMainLooper())

              protected open fun onSuccess() {
                  AppLockService.unlockedPkg = target
                  finish()
              }

              protected open fun onCancel() {
                  goHome()
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE)
                  readIntent(intent)
                  buildUi()
                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          onCancel()
                      }
                  })
              }

              override fun onNewIntent(i: Intent) {
                  super.onNewIntent(i)
                  setIntent(i)
                  readIntent(i)
                  pin.clear()
                  first = null
                  bioTried = false
                  updateTexts()
              }

              private fun readIntent(i: Intent) {
                  mode = i.getStringExtra(EXTRA_MODE) ?: ""
                  target = i.getStringExtra(EXTRA_PKG)
              }

              override fun onResume() {
                  super.onResume()
                  if (mode != MODE_SETUP && SecureStore.biometricOn(this) && !bioTried) {
                      bioTried = true
                      showBiometric()
                  }
                  refreshLock()
              }

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  super.onDestroy()
              }

              private fun oval(color: Int): GradientDrawable =
                  GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(color) }

              private fun buildUi() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(dp(24), dp(24), dp(24), dp(24))
                      background = grad(0xFF4A148C.toInt(), 0xFF0D47A1.toInt())
                  }
                  root.addView(TextView(this).apply { text = "🔐"; textSize = 44f; gravity = Gravity.CENTER })
                  titleTv = TextView(this).apply {
                      textSize = 20f; setTextColor(Color.WHITE); gravity = Gravity.CENTER
                      typeface = Typeface.DEFAULT_BOLD; setPadding(0, dp(8), 0, 0)
                  }
                  dotsTv = TextView(this).apply {
                      textSize = 28f; setTextColor(Color.WHITE); gravity = Gravity.CENTER
                      setPadding(0, dp(14), 0, dp(6))
                  }
                  msgTv = TextView(this).apply {
                      textSize = 14f; setTextColor(0xFFFFAB91.toInt()); gravity = Gravity.CENTER; minHeight = dp(26)
                  }
                  root.addView(titleTv)
                  root.addView(dotsTv)
                  root.addView(msgTv)

                  val grid = GridLayout(this).apply { columnCount = 3 }
                  listOf("1", "2", "3", "4", "5", "6", "7", "8", "9", "⌫", "0", "OK").forEach { l ->
                      val btn = Button(this).apply {
                          text = l
                          textSize = 24f
                          setTextColor(Color.WHITE)
                          typeface = Typeface.DEFAULT_BOLD
                          background = oval(if (l == "OK") 0xFF00C853.toInt() else 0x33FFFFFF)
                          setOnClickListener { press(l) }
                          layoutParams = GridLayout.LayoutParams().apply {
                              width = dp(76); height = dp(76); setMargins(dp(7), dp(7), dp(7), dp(7))
                          }
                      }
                      keys.add(btn)
                      grid.addView(btn)
                  }
                  root.addView(grid)

                  if (mode != MODE_SETUP) {
                      root.addView(TextView(this).apply {
                          text = "👆  Use fingerprint"
                          textSize = 16f
                          setTextColor(Color.WHITE)
                          setPadding(dp(18), dp(14), dp(18), dp(14))
                          setOnClickListener { showBiometric() }
                      })
                  }
                  setContentView(root)
                  updateTexts()
              }

              private fun updateTexts() {
                  titleTv.text = when {
                      mode == MODE_SETUP && first == null -> "Create a PIN (4-8 digits)"
                      mode == MODE_SETUP -> "Confirm your PIN"
                      else -> "Enter PIN"
                  }
                  val n = pin.length
                  dotsTv.text = (0 until maxOf(4, n)).joinToString(" ") { if (it < n) "●" else "○" }
              }

              private fun press(l: String) {
                  when (l) {
                      "⌫" -> if (pin.isNotEmpty()) pin.deleteCharAt(pin.length - 1)
                      "OK" -> if (pin.length >= 4) submit(pin.toString())
                              else Toast.makeText(this, "At least 4 digits", Toast.LENGTH_SHORT).show()
                      else -> if (pin.length < 8) pin.append(l)
                  }
                  updateTexts()
              }

              private fun submit(p: String) {
                  pin.clear()
                  if (mode == MODE_SETUP) {
                      if (first == null) {
                          first = p
                      } else if (first == p) {
                          SecureStore.setPin(this, p)
                          onSuccess()
                          return
                      } else {
                          first = null
                          msgTv.text = "PINs did not match, try again"
                      }
                  } else {
                      if (SecureStore.verify(this, p)) {
                          onSuccess()
                          return
                      }
                      msgTv.text = "Wrong PIN"
                      refreshLock()
                  }
                  updateTexts()
              }

              private fun refreshLock() {
                  val rem = SecureStore.lockRemainingMs(this)
                  keys.forEach { it.isEnabled = rem <= 0 }
                  if (rem > 0) {
                      msgTv.text = "Too many tries. Wait ${rem / 1000 + 1}s"
                      handler.postDelayed({ refreshLock() }, 500)
                  } else if (msgTv.text.startsWith("Too many")) {
                      msgTv.text = ""
                  }
              }

              private fun showBiometric() {
                  if (BiometricManager.from(this).canAuthenticate(BIOMETRIC_STRONG) != BiometricManager.BIOMETRIC_SUCCESS) return
                  val prompt = BiometricPrompt(this, ContextCompat.getMainExecutor(this),
                      object : BiometricPrompt.AuthenticationCallback() {
                          override fun onAuthenticationSucceeded(r: BiometricPrompt.AuthenticationResult) {
                              onSuccess()
                          }
                      })
                  prompt.authenticate(
                      BiometricPrompt.PromptInfo.Builder()
                          .setTitle("Unlock")
                          .setNegativeButtonText("Use PIN")
                          .setAllowedAuthenticators(BIOMETRIC_STRONG)
                          .build()
                  )
              }

              protected fun goHome() {
                  startActivity(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  finish()
              }
          }
          APPLOCK_EOF
          mkdir -p "$(dirname 'app/src/main/java/com/mahesh/applock/MainActivity.kt')"
          cat > 'app/src/main/java/com/mahesh/applock/MainActivity.kt' <<'APPLOCK_EOF'
          package com.mahesh.applock

          import android.app.AlertDialog
          import android.app.admin.DevicePolicyManager
          import android.content.ComponentName
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.provider.Settings
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import java.io.File

          class MainActivity : SecureActivity() {

              override fun onResume() {
                  super.onResume()
                  if (!SecureStore.hasPin(this)) gate(setup = true) { render() } else gate(60_000L) { render() }
              }

              override fun onAuthCancelled() {
                  finishAffinity()
              }

              private fun a11yOn(): Boolean {
                  val s = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: ""
                  return s.contains(ComponentName(this, AppLockService::class.java).flattenToString())
              }

              private fun render() {
                  val on = a11yOn()
                  val lockedCount = SecureStore.lockedApps(this).size
                  val vaultCount = File(filesDir, "vault").listFiles()?.size ?: 0

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(36), dp(20), dp(20))
                      background = grad(0xFF4A148C.toInt(), 0xFF0D47A1.toInt())
                  }

                  val top = LinearLayout(this).apply { gravity = Gravity.CENTER_VERTICAL }
                  top.addView(TextView(this).apply {
                      text = "🛡️ App Lock"; textSize = 26f; setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD
