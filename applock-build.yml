          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "AppLock"
          include(":app")
          APPLOCK_EOF

      - name: Use custom logo (only if logo.png is in repo root)
        run: |
          if [ -f logo.png ]; then
            command -v convert >/dev/null || sudo apt-get install -y imagemagick
            for s in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              d=${s%%:*}; px=${s##*:}
              mkdir -p proj/app/src/main/res/mipmap-$d
              convert logo.png -resize ${px}x${px}^ -gravity center -extent ${px}x${px} proj/app/src/main/res/mipmap-$d/ic_launcher.png
            done
            rm -rf proj/app/src/main/res/mipmap-anydpi-v26
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          yes | "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AppLock-debug-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
