          mkdir -p "$(dirname 'app/src/main/java/com/mahesh/applock/SecureStore.kt')"
          cat > 'app/src/main/java/com/mahesh/applock/SecureStore.kt' <<'APPLOCK_EOF'
          package com.mahesh.applock

          import android.content.Context
          import android.content.SharedPreferences
          import android.util.Base64
          import androidx.security.crypto.EncryptedSharedPreferences
          import androidx.security.crypto.MasterKey
          import java.security.MessageDigest
          import java.security.SecureRandom
          import javax.crypto.SecretKeyFactory
          import javax.crypto.spec.PBEKeySpec

          object SecureStore {
              const val PHOTOS = "com.google.android.apps.photos"
              private const val ITER = 120_000
              @Volatile private var prefs: SharedPreferences? = null

              fun masterKey(c: Context): MasterKey =
                  MasterKey.Builder(c.applicationContext).setKeyScheme(MasterKey.KeyScheme.AES256_GCM).build()

              private fun sp(c: Context): SharedPreferences = prefs ?: synchronized(this) {
                  prefs ?: EncryptedSharedPreferences.create(
                      c.applicationContext, "secure_prefs", masterKey(c),
                      EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV,
                      EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM
                  ).also { prefs = it }
              }

              private fun hash(pin: String, salt: ByteArray): ByteArray =
                  SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256")
                      .generateSecret(PBEKeySpec(pin.toCharArray(), salt, ITER, 256)).encoded

              private fun b64(b: ByteArray) = Base64.encodeToString(b, Base64.NO_WRAP)
              private fun unb64(s: String) = Base64.decode(s, Base64.NO_WRAP)

              fun hasPin(c: Context) = sp(c).contains("hash")

              fun setPin(c: Context, pin: String) {
                  val salt = ByteArray(16).also { SecureRandom().nextBytes(it) }
                  val e = sp(c).edit()
                      .putString("salt", b64(salt)).putString("hash", b64(hash(pin, salt)))
                      .putInt("fails", 0).putLong("lockUntil", 0)
                  if (!sp(c).contains("locked")) e.putStringSet("locked", setOf(PHOTOS)) // Google Photos default locked
                  e.apply()
              }

              fun lockRemainingMs(c: Context): Long =
                  (sp(c).getLong("lockUntil", 0) - System.currentTimeMillis()).coerceAtLeast(0)

              fun verify(c: Context, pin: String): Boolean {
                  if (lockRemainingMs(c) > 0) return false
                  val s = sp(c)
                  val salt = unb64(s.getString("salt", "") ?: return false)
                  val expected = unb64(s.getString("hash", "") ?: return false)
                  val ok = MessageDigest.isEqual(expected, hash(pin, salt))
                  if (ok) {
                      s.edit().putInt("fails", 0).putLong("lockUntil", 0).apply()
                  } else {
                      val f = s.getInt("fails", 0) + 1
                      var until = 0L
                      if (f >= 5) { // 5 galat ke baad 30s, phir double hota jayega (max 1 ghanta)
                          val d = minOf(30_000L shl minOf(f - 5, 7), 3_600_000L)
                          until = System.currentTimeMillis() + d
                      }
                      s.edit().putInt("fails", f).putLong("lockUntil", until).apply()
                  }
                  return ok
              }

              fun lockedApps(c: Context): Set<String> = sp(c).getStringSet("locked", emptySet()) ?: emptySet()
              fun setLocked(c: Context, pkg: String, on: Boolean) {
                  val n = HashSet(lockedApps(c))
                  if (on) n.add(pkg) else n.remove(pkg)
                  sp(c).edit().putStringSet("locked", n).apply()
              }

              fun biometricOn(c: Context) = sp(c).getBoolean("bio", true)
              fun setBiometric(c: Context, on: Boolean) = sp(c).edit().putBoolean("bio", on).apply()
          }
